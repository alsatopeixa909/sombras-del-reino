 
  
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sombras del Reino</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #10150f;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: #26351f;
}

#title {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 32px;
  font-weight: bold;
  text-shadow: 0 3px 8px black;
  z-index: 10;
}

#map {
  position: absolute;
  width: 1100px;
  height: 800px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: #526b3b;
  border: 8px solid #252b20;
  border-radius: 35px;
  box-shadow: 0 0 50px #000;
}

.path {
  position: absolute;
  background: #a58a5b;
  border-radius: 50px;
}

.vertical {
  width: 90px;
  height: 700px;
  left: 505px;
  top: 50px;
}

.horizontal {
  width: 900px;
  height: 90px;
  left: 100px;
  top: 350px;
}

.zone {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: bold;
  font-size: 22px;
  text-shadow: 0 2px 5px black;
  border: 4px solid rgba(0,0,0,.35);
  box-shadow: 0 8px 20px rgba(0,0,0,.4);
}

#spawn {
  width: 230px;
  height: 170px;
  left: 435px;
  top: 315px;
  border-radius: 50%;
  background: #68745d;
  border-color: #d5c58b;
  font-size: 26px;
}

#forest {
  width: 260px;
  height: 210px;
  left: 45px;
  top: 45px;
  border-radius: 35px;
  background: #1e4725;
}

#ruins {
  width: 260px;
  height: 210px;
  right: 45px;
  top: 45px;
  border-radius: 35px;
  background: #4b4037;
}

#caves {
  width: 260px;
  height: 210px;
  left: 45px;
  bottom: 45px;
  border-radius: 35px;
  background: #24252a;
}

#lake {
  width: 260px;
  height: 210px;
  right: 45px;
  bottom: 45px;
  border-radius: 50%;
  background: #245a70;
}

#arena {
  width: 180px;
  height: 120px;
  left: 460px;
  bottom: 35px;
  border-radius: 50%;
  background: #704a35;
}

.tree {
  position: absolute;
  font-size: 38px;
}

.enemy {
  position: absolute;
  font-size: 32px;
}

#player {
  position: absolute;
  left: 535px;
  top: 370px;
  font-size: 40px;
  z-index: 5;
}

#info {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 20;
  background: rgba(0,0,0,.7);
  padding: 12px 18px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div id="game">

<div id="title">⚔️ SOMBRAS DEL REINO ⚔️</div>

<div id="map">

<div class="path vertical"></div>
<div class="path horizontal"></div>

<div id="forest" class="zone">🌲 BOSQUE</div>
<div id="ruins" class="zone">🏚️ RUINAS</div>
<div id="caves" class="zone">🪨 CUEVAS</div>
<div id="lake" class="zone">🌊 LAGO</div>
<div id="arena" class="zone">⚔️ ARENA</div>
<div id="spawn" class="zone">🏕️ SPAWN</div>

<div id="player">🧙</div>

<div class="tree" style="left:80px;top:90px;">🌲</div>
<div class="tree" style="left:180px;top:110px;">🌲</div>
<div class="tree" style="left:100px;top:180px;">🌳</div>
<div class="tree" style="left:230px;top:190px;">🌲</div>

<div class="enemy" style="left:180px;top:250px;">👾</div>
<div class="enemy" style="left:300px;top:150px;">👾</div>
<div class="enemy" style="left:760px;top:180px;">👹</div>
<div class="enemy" style="left:820px;top:260px;">💀</div>

</div>

<div id="info">
Nivel: <b>0</b> ♾️
&nbsp; | &nbsp;
🪙 Monedas: 0
&nbsp; | &nbsp;
⚔️ Explora y lucha
</div>

</div>

</body>
</html>
