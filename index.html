 
  
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sombras del Reino</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    #start {
        position: fixed;
        inset: 0;
        background: #111;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    #start h1 {
        font-size: 42px;
        margin-bottom: 30px;
    }

    #start button {
        padding: 18px 35px;
        font-size: 20px;
        cursor: pointer;
        border: 0;
        border-radius: 10px;
    }

    #hud {
        position: fixed;
        top: 15px;
        left: 15px;
        color: white;
        background: rgba(0,0,0,.55);
        padding: 12px 18px;
        border-radius: 10px;
        z-index: 5;
    }

    #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 25px;
        z-index: 4;
    }

    #message {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: rgba(0,0,0,.7);
        padding: 12px 20px;
        border-radius: 10px;
        display: none;
        z-index: 6;
    }
</style>
</head>

<body>

<div id="start">
    <h1>⚔️ SOMBRAS DEL REINO ⚔️</h1>
    <button id="playButton">ENTRAR AL REINO</button>
</div>

<div id="hud">
    Nivel: 0 | 🪙 Monedas: 0
</div>

<div id="crosshair">+</div>

<div id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

const keys = {};

const speed = 0.18;


// ==========================
// CREAR MUNDO
// ==========================

function createWorld() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    // CÁMARA
    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        500
    );

    // Spawn
    camera.position.set(0, 3, 15);


    // LUZ
    const light = new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2
    );

    scene.add(light);

    const sun = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    sun.position.set(50, 100, 50);

    scene.add(sun);


    // SUELO
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(400, 400),
        new THREE.MeshStandardMaterial({
            color: 0x3d7a35
        })
    );

    ground.rotation.x = -Math.PI / 2;

    scene.add(ground);


    // ==========================
    // SPAWN
    // ==========================

    const spawn = new THREE.Mesh(
        new THREE.CylinderGeometry(16, 16, 0.5, 32),
        new THREE.MeshStandardMaterial({
            color: 0x777777
        })
    );

    spawn.position.set(0, 0.25, 15);

    scene.add(spawn);


    // FUEGO DEL SPAWN

    const fire = new THREE.Mesh(
        new THREE.SphereGeometry(1.5, 16, 16),
        new THREE.MeshStandardMaterial({
            color: 0xff6600,
            emissive: 0xff2200
        })
    );

    fire.position.set(0, 1.5, 15);

    scene.add(fire);


    // PIEDRAS DEL FUEGO

    for (let i = 0; i < 8; i++) {

        const angle = i / 8 * Math.PI * 2;

        const stone = new THREE.Mesh(
            new THREE.SphereGeometry(.6, 8, 8),
            new THREE.MeshStandardMaterial({
                color: 0x333333
            })
        );

        stone.position.set(
            Math.cos(angle) * 3,
            .5,
            15 + Math.sin(angle) * 3
        );

        scene.add(stone);
    }


    // ==========================
    // TIENDA
    // ==========================

    createShop();


    // ==========================
    // CAMINO
    // ==========================

    const path = new THREE.Mesh(
        new THREE.BoxGeometry(8, 0.1, 100),
        new THREE.MeshStandardMaterial({
            color: 0x9b7545
        })
    );

    path.position.set(0, 0.05, -35);

    scene.add(path);


    // ==========================
    // BOSQUE
    // ==========================

    createForest();


    // ==========================
    // ENEMIGOS
    // ==========================

    createEnemy(18, -25, 0xff3333, "MORDISCO");

    createEnemy(-20, -35, 0xff3333, "MORDISCO");

    createEnemy(30, -55, 0x550000, "GUARDIÁN");


    // ==========================
    // LAGO
    // ==========================

    const lake = new THREE.Mesh(
        new THREE.CircleGeometry(18, 32),
        new THREE.MeshStandardMaterial({
            color: 0x2878c8
        })
    );

    lake.rotation.x = -Math.PI / 2;

    lake.position.set(65, 0.08, 40);

    scene.add(lake);


    // ==========================
    // ARENA
    // ==========================

    const arena = new THREE.Mesh(
        new THREE.CylinderGeometry(15, 15, 0.5, 32),
        new THREE.MeshStandardMaterial({
            color: 0x9b7045
        })
    );

    arena.position.set(-60, 0.25, 40);

    scene.add(arena);


    // RENDERER

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(renderer.domElement);


    // MOVIMIENTO

    document.addEventListener("keydown", function(e) {
        keys[e.key.toLowerCase()] = true;
    });

    document.addEventListener("keyup", function(e) {
        keys[e.key.toLowerCase()] = false;
    });


    // RATÓN

    document.addEventListener("mousemove", function(e) {

        if (document.pointerLockElement === renderer.domElement) {

            camera.rotation.y -= e.movementX * 0.002;

            camera.rotation.x -= e.movementY * 0.002;

            camera.rotation.x = Math.max(
                -1.4,
                Math.min(1.4, camera.rotation.x)
            );
        }

    });


    renderer.domElement.addEventListener(
        "click",
        function() {
            renderer.domElement.requestPointerLock();
        }
    );


    animate();
}


// ==========================
// TIENDA
// ==========================

function createShop() {

    // Edificio

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(12, 7, 9),
        new THREE.MeshStandardMaterial({
            color: 0x8b5a2b
        })
    );

    building.position.set(15, 3.5, 15);

    scene.add(building);


    // TECHO

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(9, 4, 4),
        new THREE.MeshStandardMaterial({
            color: 0x402313
        })
    );

    roof.position.set(15, 9, 15);

    roof.rotation.y = Math.PI / 4;

    scene.add(roof);


    // PUERTA

    const door = new THREE.Mesh(
        new THREE.BoxGeometry(3, 4, 0.3),
        new THREE.MeshStandardMaterial({
            color: 0x24150d
        })
    );

    door.position.set(15, 2, 10.4);

    scene.add(door);


    // CARTEL

    const sign = new THREE.Mesh(
        new THREE.BoxGeometry(8, 2, 0.3),
        new THREE.MeshStandardMaterial({
            color: 0xd6b85c
        })
    );

    sign.position.set(15, 6.5, 10.3);

    scene.add(sign);
}


// ==========================
// BOSQUE
// ==========================

function createForest() {

    for (let i = 0; i < 40; i++) {

        const x = -70 + Math.random() * 140;

        const z = -100 + Math.random() * 55;


        // TRONCO

        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.6,
                0.8,
                5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x5a3518
            })
        );

        trunk.position.set(x, 2.5, z);

        scene.add(trunk);


        // COPA

        const leaves = new THREE.Mesh(
            new THREE.ConeGeometry(3, 7, 8),
            new THREE.MeshStandardMaterial({
                color: 0x145c24
            })
        );

        leaves.position.set(x, 7, z);

        scene.add(leaves);
    }
}


// ==========================
// ENEMIGO
// ==========================

function createEnemy(x, z, color, name) {

    const enemy = new THREE.Mesh(
        new THREE.SphereGeometry(2, 16, 16),
        new THREE.MeshStandardMaterial({
            color: color
        })
    );

    enemy.position.set(x, 2, z);

    enemy.userData.name = name;

    scene.add(enemy);
}


// ==========================
// MOVIMIENTO
// ==========================

function updateMovement() {

    if (!camera) return;


    const direction = new THREE.Vector3();

    camera.getWorldDirection(direction);

    direction.y = 0;

    direction.normalize();


    const right = new THREE.Vector3();

    right.crossVectors(
        direction,
        new THREE.Vector3(0, 1, 0)
    );


    if (keys["w"] || keys["arrowup"]) {

        camera.position.addScaledVector(
            direction,
            speed
        );
    }


    if (keys["s"] || keys["arrowdown"]) {

        camera.position.addScaledVector(
            direction,
            -speed
        );
    }


    if (keys["a"] || keys["arrowleft"]) {

        camera.position.addScaledVector(
            right,
            -speed
        );
    }


    if (keys["d"] || keys["arrowright"]) {

        camera.position.addScaledVector(
            right,
            speed
        );
    }


    camera.position.y = 3;
}


// ==========================
// ANIMACIÓN
// ==========================

function animate() {

    requestAnimationFrame(animate);

    updateMovement();

    renderer.render(
        scene,
        camera
    );
}


// ==========================
// EMPEZAR JUEGO
// ==========================

document.getElementById("playButton").addEventListener(
    "click",
    function() {

        document.getElementById("start").style.display = "none";

        createWorld();

        renderer.domElement.requestPointerLock();
    }
);


// ==========================
// CAMBIO DE TAMAÑO
// ==========================

window.addEventListener("resize", function() {

    if (!camera || !renderer) return;

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
